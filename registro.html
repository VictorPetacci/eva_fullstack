<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Registro - Tienda en Línea</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header class="encabezado-sitio">
      <div class="contenedor">
        <h1>Mi Tienda en Línea</h1>
        <nav aria-label="Navegación principal">
          <ul>
            <li><a href="index.html">Inicio</a></li>
            <li><a href="productos.html">Productos</a></li>
            <li><a href="nosotros.html">Nosotros</a></li>
            <li><a href="blogs.html">Blogs</a></li>
            <li><a href="index.html#contacto">Contacto</a></li>
            <li>
              <a class="enlace-carrito" href="carrito.html" aria-label="Ver carrito" title="Ver carrito">
                <span class="logo-carrito" aria-hidden="true">&#128722;<span class="contador-carrito">0</span></span>
              </a>
            </li>
          </ul>
        </nav>
      </div>
    </header>
    <main class="contenedor pagina-registro">
      <button type="button" class="boton-volver" onclick="history.back()">Volver</button>
      <h2>Formulario de Registro</h2>

        <form id="formularioRegistro" novalidate>
          <div class="grupo-formulario">
            <label for="nombre">Nombre Completo:</label>
            <input type="text" id="nombre" name="nombre" required />
            <span class="mensaje-error" id="errorNombre"></span>
          </div>

          <div class="grupo-formulario">
            <label for="runRegistro">RUN:</label>
            <input type="text" id="runRegistro" name="runRegistro" placeholder="12345678K" required />
            <span class="mensaje-error" id="errorRunRegistro"></span>
          </div>

          <div class="grupo-formulario">
            <label for="direccionRegistro">Dirección:</label>
            <input type="text" id="direccionRegistro" name="direccionRegistro" required />
            <span class="mensaje-error" id="errorDireccionRegistro"></span>
          </div>

          <div class="grupo-formulario">
            <label for="regionRegistro">Región:</label>
            <select id="regionRegistro" name="regionRegistro" required>
              <option value="">Selecciona una región</option>
            </select>
            <span class="mensaje-error" id="errorRegionRegistro"></span>
          </div>

          <div class="grupo-formulario">
            <label for="comunaRegistro">Comuna:</label>
            <select id="comunaRegistro" name="comunaRegistro" required>
              <option value="">Selecciona una comuna</option>
            </select>
            <span class="mensaje-error" id="errorComunaRegistro"></span>
          </div>

          <div class="grupo-formulario">
            <label for="email">Correo Electrónico:</label>
            <input
              type="email"
              id="correo"
              name="correo"
              placeholder="ejemplo@correo.cl"
              required
            />
            <span class="mensaje-error" id="errorCorreo"></span>
          </div>

          <div class="grupo-formulario">
            <label for="contrasena">Contraseña:</label>
            <input
              type="password"
              id="contrasena"
              name="contrasena"
              required
            />
            <span class="mensaje-error" id="errorContrasena"></span>
          </div>

          <button type="submit">Enviar</button>
          <p id="mensajeRegistroExitoso" class="mensaje-exito"></p>
        </form>



    </main>

    <footer class="pie-sitio">
      <p>&copy; 2026 Tienda Online Duoc UC. Todos los derechos reservados.</p>
    </footer>

    <script src="jscript.js"></script>
  </body>
</html>
