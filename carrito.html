<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Carrito - Tienda en Línea</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header class="encabezado-sitio">
      <div class="contenedor">
        <a href="index.html" class="logo-sitio"><h1>Mi Tienda en Línea</h1></a>
        <nav aria-label="Navegación principal">
          <ul>
            <li><a href="index.html">Inicio</a></li>
            <li><a href="productos.html">Productos</a></li>
            <li><a href="nosotros.html">Nosotros</a></li>
            <li><a href="blogs.html">Blogs</a></li>
            <li><a href="index.html#contacto">Contacto</a></li>
            <li>
              <a class="enlace-carrito" href="carrito.html" aria-label="Ver carrito" title="Ver carrito">
                <span class="logo-carrito" aria-hidden="true">&#128722;<span class="contador-carrito">0</span></span>
              </a>
            </li>
          </ul>
        </nav>
      </div>
    </header>

    <main class="contenedor pagina-carrito">
      <div class="barra-pagina">
        <button type="button" class="boton-volver" onclick="history.back()">Volver</button>
        <div class="cuadro-cuenta">
          <a class="enlace-cuenta" href="iniciar-sesion.html">Iniciar Sesión</a>
          <a class="enlace-cuenta" href="registro.html">Registro</a>
        </div>
      </div>
      <h2>Mi carrito</h2>
      <div id="lista-carrito" class="lista-carrito"></div>
      <div class="resumen-carrito">
        <strong>Total: $<span id="total-carrito">0</span></strong>
        <button type="button" id="boton-comprar">Simular compra</button>
      </div>
      <p id="mensaje-compra" class="mensaje-exito"></p>
    </main>

    <script src="jscript.js"></script>
  </body>
</html>
