<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tienda en Linea - DSY1104</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header class="encabezado-sitio">
      <div class="contenedor">
        <h1>Mi Tienda en Linea</h1>
        <nav aria-label="Navegación principal">
          <ul>
            <li><a href="index.html">Inicio</a></li>
            <li><a href="#productos">Productos</a></li>
            <li><a href="#contacto">Contacto</a></li>
          </ul>
        </nav>
      </div>
    </header>

    <main class="contenedor">
      <section id="destacado" class="seccion-destacada">
        <h2>Video de Lanzamiento</h2>
        <div class="contenedor-video">
          <iframe
            src="https://www.youtube.com/embed/dQw4w9WgXcQ"
            title="Video promocional"
            frameborder="0"
            allowfullscreen
            loading="lazy"
          ></iframe>
        </div>
      </section>

      <section id="productos">
        <h2>Productos Destacados</h2>
        <div id="contenedor-productos" class="seccion-productos"></div>
      </section>

      <section id="contacto" class="seccion-contacto">
        <h2>Formulario de Registro</h2>

        <form id="formularioRegistro" novalidate>
          <div class="grupo-formulario">
            <label for="nombre">Nombre Completo:</label>
            <input type="text" id="nombre" name="nombre" required />
            <span class="mensaje-error" id="errorNombre"></span>
          </div>

          <div class="grupo-formulario">
            <label for="email">Correo Electrónico:</label>
            <input
              type="email"
              id="correo"
              name="correo"
              placeholder="ejemplo@correo.cl"
              required
            />
            <span class="mensaje-error" id="errorCorreo"></span>
          </div>

          <button type="submit">Enviar</button>
        </form>
      </section>
    </main>

    <footer class="pie-sitio">
      <p>&copy; 2026 Tienda Online Duoc UC. Todos los derechos reservados.</p>
    </footer>

    <script src="jscript.js"></script>
  </body>
</html>
