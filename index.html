<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tienda en Linea - DSY1104</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header class="encabezado-sitio">
      <div class="contenedor">
        <h1>Mi Tienda en Linea</h1>
        <nav aria-label="Navegación principal">
          <ul>
            <li><a href="index.html">Inicio</a></li>
            <li><a href="productos.html">Productos</a></li>
            <li><a href="#contacto">Contacto</a></li>
          </ul>
        </nav>

        <div class="cuadro-cuenta">
          <a class="enlace-cuenta" href="iniciar-sesion.html">Iniciar Sesión</a>
          <a class="enlace-cuenta" href="registro.html">Registro</a>
        </div>
      </div>
    </header>

    <main class="contenedor">
      <section id="destacado" class="seccion-destacada">
        <h2>Video de Lanzamiento</h2>
        <div class="contenedor-video">
          <iframe
            src="https://www.youtube.com/embed/dQw4w9WgXcQ"
            title="Video promocional"
            frameborder="0"
            allowfullscreen
            loading="lazy"
          ></iframe>
        </div>
      </section>

      <section id="contacto" class="seccion-contacto">
        <h2>Contacto</h2>

        <div class="informacion-contacto">
          <div>
            <h3>Visítanos</h3>
            <p>Dirección: Avenida Providencia 1234, Santiago, Chile.</p>
            <div class="cuadro-redes">
              <h3>Redes sociales</h3>
              <a class="boton-red-social" href="https://wa.me/56912345678" target="_blank" rel="noopener noreferrer">
                <img class="logo-red-social" src="https://cdn.simpleicons.org/whatsapp/25D366" alt="" />
                WhatsApp
              </a>
              <a class="boton-red-social" href="https://www.facebook.com/" target="_blank" rel="noopener noreferrer">
                <img class="logo-red-social" src="https://cdn.simpleicons.org/facebook/1877F2" alt="" />
                Facebook
              </a>
              <a class="boton-red-social" href="https://www.instagram.com/" target="_blank" rel="noopener noreferrer">
                <img class="logo-red-social" src="https://cdn.simpleicons.org/instagram/E4405F" alt="" />
                Instagram
              </a>
              <a class="boton-red-social" href="https://www.tiktok.com/" target="_blank" rel="noopener noreferrer">
                <img class="logo-red-social" src="https://cdn.simpleicons.org/tiktok/FFFFFF" alt="" />
                TikTok
              </a>
            </div>
          </div>

          <div class="mapa-contacto">
            <iframe
              src="https://www.google.com/maps?q=Plaza+de+Armas,+Santiago,+Chile&output=embed"
              title="Mapa de nuestra dirección"
              loading="lazy"
            ></iframe>
          </div>
        </div>
      </section>

    <footer class="pie-sitio">
      <p>&copy; 2026 Tienda Online Duoc UC. Todos los derechos reservados.</p>
    </footer>

    <script src="jscript.js"></script>
  </body>
</html>
